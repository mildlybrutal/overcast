# REST query API (Gin) with Redis cache-aside over Postgres.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: overcast
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: overcast
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: overcast
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - for dep in postgres:5432 redis:6379; do until nc -z ${dep%:*} ${dep#*:}; do echo "waiting for $dep"; sleep 2; done; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: api
          image: overcast/api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: overcast-config
          env:
            - name: PORT
              value: "8080"
            - name: GIN_MODE
              value: "release"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: overcast-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: overcast-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_CONN
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)?sslmode=disable"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          # The HTTP server listens only after Postgres and Redis pings succeed.
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: overcast
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: overcast
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8080
      targetPort: http
