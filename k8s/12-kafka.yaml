# Single-node Kafka in KRaft mode (broker + controller in one process),
# mirroring the docker-compose setup.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: overcast
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: overcast
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/part-of: overcast
    spec:
      # A Service named "kafka" makes Kubernetes inject KAFKA_PORT=tcp://...,
      # which the Confluent image reads as broker config and fails on.
      enableServiceLinks: false
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.6.0
          ports:
            - name: kafka
              containerPort: 9092
            - name: controller
              containerPort: 29093
          env:
            - name: CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qk"
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            # localhost, not the Service: a Service only routes to ready pods,
            # and the broker can't become ready without reaching its controller.
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:29093"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
            - name: KAFKA_HEAP_OPTS
              value: "-Xms512m -Xmx512m"
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: kafka
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: kafka
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: overcast
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: overcast
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
---
# Creates the event topic once the broker is reachable. Idempotent
# (--if-not-exists); retries via backoffLimit while Kafka is still starting.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topic-init
  namespace: overcast
  labels:
    app.kubernetes.io/name: kafka-topic-init
    app.kubernetes.io/part-of: overcast
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-topic-init
        app.kubernetes.io/part-of: overcast
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      containers:
        - name: create-topic
          image: confluentinc/cp-kafka:7.6.0
          env:
            - name: KAFKA_BROKER
              valueFrom:
                configMapKeyRef:
                  name: overcast-config
                  key: KAFKA_BROKER
            - name: KAFKA_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: overcast-config
                  key: KAFKA_TOPIC
          command:
            - sh
            - -c
            - >-
              kafka-topics --bootstrap-server "$KAFKA_BROKER"
              --create --if-not-exists
              --topic "$KAFKA_TOPIC"
              --partitions 3 --replication-factor 1
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
