# Kafka consumer -> dual write to Postgres (creates the matches table) and Redis.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: processing
  namespace: overcast
  labels:
    app.kubernetes.io/name: processing
    app.kubernetes.io/part-of: overcast
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: processing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: processing
        app.kubernetes.io/part-of: overcast
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - for dep in postgres:5432 redis:6379 kafka:9092; do until nc -z ${dep%:*} ${dep#*:}; do echo "waiting for $dep"; sleep 2; done; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: processing
          image: overcast/processing:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: overcast-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: overcast-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: overcast-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_CONN
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)?sslmode=disable"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          # The metrics server starts only after Postgres and Redis connect.
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: processing
  namespace: overcast
  labels:
    app.kubernetes.io/name: processing
    app.kubernetes.io/part-of: overcast
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: processing
  ports:
    - name: metrics
      port: 8082
      targetPort: metrics
