# Polls CricAPI every 30s and publishes Protobuf events to Kafka.
#
# No Service and no probes: the ingestion worker exposes no network port, so
# there is nothing to route to or probe. Kubernetes still restarts it if the
# process exits (it fails fast when CRICKET_API_KEY is empty).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  namespace: overcast
  labels:
    app.kubernetes.io/name: ingestion
    app.kubernetes.io/part-of: overcast
spec:
  # Keep at 1: each replica polls the external API independently.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ingestion
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingestion
        app.kubernetes.io/part-of: overcast
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z kafka 9092; do echo "waiting for kafka:9092"; sleep 2; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: ingestion
          image: overcast/ingestion:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: overcast-config
          env:
            - name: CRICKET_API_KEY
              valueFrom:
                secretKeyRef:
                  name: overcast-secrets
                  key: CRICKET_API_KEY
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
