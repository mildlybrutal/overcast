# WebSocket push service (actor model over Redis Pub/Sub).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  namespace: overcast
  labels:
    app.kubernetes.io/name: notification
    app.kubernetes.io/part-of: overcast
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notification
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification
        app.kubernetes.io/part-of: overcast
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z redis 6379; do echo "waiting for redis:6379"; sleep 2; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: notification
          image: overcast/notification:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: overcast-config
          env:
            - name: PORT
              value: "8081"
            # Uncomment to restrict WebSocket origins (unset = accept any origin).
            # - name: ALLOWED_ORIGINS
            #   value: "http://localhost:3000"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: notification
  namespace: overcast
  labels:
    app.kubernetes.io/name: notification
    app.kubernetes.io/part-of: overcast
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: notification
  ports:
    - name: http
      port: 8081
      targetPort: http
