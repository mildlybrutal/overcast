# Shared credentials.
#
# These are LOCAL DEVELOPMENT values only (they match docker-compose.yaml).
# Do not commit real credentials here. To set the real CricAPI key without
# editing this file, run after the first apply:
#
#   kubectl -n overcast create secret generic overcast-secrets \
#     --from-literal=POSTGRES_USER=cricket_admin \
#     --from-literal=POSTGRES_PASSWORD=cricket_password \
#     --from-literal=CRICKET_API_KEY=<your-key> \
#     --dry-run=client -o yaml | kubectl apply -f -
#   kubectl -n overcast rollout restart deployment/ingestion
apiVersion: v1
kind: Secret
metadata:
  name: overcast-secrets
  namespace: overcast
  labels:
    app.kubernetes.io/part-of: overcast
type: Opaque
stringData:
  POSTGRES_USER: "cricket_admin"
  POSTGRES_PASSWORD: "cricket_password"
  CRICKET_API_KEY: "replace-me"
