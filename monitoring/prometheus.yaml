global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "overcast_api"
    static_configs:
      - targets: ["api:8080"]
  - job_name: "overcast-notification"
    static_configs:
      - targets: ["notification:8081"]
  - job_name: "overcast-processing"
    static_configs:
      - targets: ["processing:8082"]
