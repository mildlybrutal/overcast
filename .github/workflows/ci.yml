name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - gen
          - internal/models
          - services/api
          - services/ingestion
          - services/notification
          - services/processing
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, ingestion, notification, processing]
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build -f services/${{ matrix.service }}/Dockerfile .
